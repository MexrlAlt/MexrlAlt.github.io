<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSSFontFace UAF</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow+Condensed:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0a0a0b;
      --surface: #111114;
      --border: #2a2a30;
      --border-hot: #e8ff00;
      --text: #d4d4cc;
      --text-dim: #5a5a60;
      --accent: #e8ff00;
      --accent-alt: #ff4c29;
      --console-bg: #080809;
      --console-text: #9dff6e;
      --console-dim: #4a7a35;
      --tick: #e8ff00;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Share Tech Mono', monospace;
      overflow-x: hidden;
    }

    /* scanline overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.07) 2px,
        rgba(0,0,0,0.07) 4px
      );
      pointer-events: none;
      z-index: 9999;
    }

    /* noise layer */
    body::after {
      content: '';
      position: fixed;
      inset: -50%;
      width: 200%;
      height: 200%;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 9998;
      opacity: 0.35;
      animation: noise-shift 8s steps(2) infinite;
    }

    @keyframes noise-shift {
      0%   { transform: translate(0, 0); }
      25%  { transform: translate(-1%, 1%); }
      50%  { transform: translate(1%, -1%); }
      75%  { transform: translate(-0.5%, 0.5%); }
      100% { transform: translate(0, 0); }
    }

    /* ─── LAYOUT ─── */
    .shell {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      max-width: 960px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* ─── HEADER ─── */
    .hdr {
      border-bottom: 1px solid var(--border);
      padding: 22px 0 18px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
    }

    .hdr-left {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .hdr-tag {
      font-family: 'Share Tech Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--text-dim);
    }

    .hdr-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 900;
      font-size: 38px;
      line-height: 1;
      letter-spacing: -0.01em;
      color: #fff;
      text-transform: uppercase;
    }

    .hdr-title span {
      color: var(--accent);
    }

    .hdr-ua {
      font-size: 11px;
      color: var(--text-dim);
      letter-spacing: 0.04em;
      text-align: right;
      line-height: 1.5;
      max-width: 280px;
    }

    .hdr-ua strong {
      color: var(--text);
      display: block;
    }

    /* ─── MAIN ─── */
    .main {
      padding: 32px 0;
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 24px;
      align-items: start;
    }

    /* ─── CONTROL PANEL ─── */
    .ctrl-panel {
      display: flex;
      flex-direction: column;
      gap: 0;
      border: 1px solid var(--border);
    }

    .ctrl-section {
      border-bottom: 1px solid var(--border);
    }

    .ctrl-section:last-child {
      border-bottom: none;
    }

    .ctrl-label {
      font-size: 9px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--text-dim);
      padding: 10px 14px 8px;
      border-bottom: 1px solid var(--border);
      background: rgba(255,255,255,0.015);
    }

    /* kernel selector */
    .kernel-opts {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .k-opt {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      padding: 9px 12px;
      border: 1px solid transparent;
      transition: border-color 0.12s, background 0.12s;
      position: relative;
    }

    .k-opt:hover {
      border-color: var(--border);
      background: rgba(232,255,0,0.03);
    }

    .k-opt input[type="radio"] {
      appearance: none;
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border: 1px solid var(--text-dim);
      flex-shrink: 0;
      position: relative;
      cursor: pointer;
      transition: border-color 0.12s;
    }

    .k-opt input[type="radio"]:checked {
      border-color: var(--accent);
    }

    .k-opt input[type="radio"]:checked::after {
      content: '';
      position: absolute;
      inset: 2px;
      background: var(--accent);
    }

    .k-opt-name {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 17px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text);
      transition: color 0.12s;
      flex: 1;
    }

    .k-opt input[type="radio"]:checked ~ .k-opt-name {
      color: #fff;
    }

    .k-opt-sub {
      font-size: 10px;
      color: var(--text-dim);
      letter-spacing: 0.05em;
    }

    /* status strip */
    .status-strip {
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--text-dim);
      flex-shrink: 0;
      transition: background 0.2s;
    }

    .status-dot.ready    { background: #5a7a50; }
    .status-dot.running  { background: var(--accent); animation: pulse-dot 0.6s ease-in-out infinite alternate; }
    .status-dot.success  { background: #9dff6e; }
    .status-dot.error    { background: var(--accent-alt); }

    @keyframes pulse-dot {
      from { opacity: 0.4; }
      to   { opacity: 1; }
    }

    .status-text {
      font-size: 11px;
      color: var(--text-dim);
      letter-spacing: 0.06em;
    }

    /* execute button */
    .exec-wrap {
      padding: 14px;
    }

    #jeilbrek {
      width: 100%;
      background: var(--accent);
      color: #0a0a0b;
      border: none;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 900;
      font-size: 20px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 14px 0;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: background 0.1s;
      clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 0 100%);
    }

    #jeilbrek::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0);
      transition: background 0.1s;
    }

    #jeilbrek:hover::before {
      background: rgba(0,0,0,0.12);
    }

    #jeilbrek:active {
      background: #c8df00;
      transform: translateY(1px);
    }

    #jeilbrek.running {
      background: var(--border);
      color: var(--text-dim);
      cursor: not-allowed;
      animation: btn-stripe 1s linear infinite;
      background-size: 20px 20px;
      background-image: repeating-linear-gradient(
        45deg,
        var(--border) 0,
        var(--border) 10px,
        #1a1a1e 10px,
        #1a1a1e 20px
      );
    }

    @keyframes btn-stripe {
      from { background-position: 0 0; }
      to   { background-position: 20px 0; }
    }

    /* ─── CONSOLE ─── */
    .console-wrap {
      display: flex;
      flex-direction: column;
      gap: 0;
      height: 100%;
      border: 1px solid var(--border);
    }

    .console-hdr {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 14px;
      border-bottom: 1px solid var(--border);
      background: rgba(255,255,255,0.015);
    }

    .console-hdr-left {
      font-size: 9px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--text-dim);
    }

    .console-hdr-right {
      display: flex;
      gap: 6px;
    }

    .c-dot {
      width: 8px;
      height: 8px;
      border: 1px solid var(--border);
    }

    .c-dot.y { border-color: #e8ff00; background: rgba(232,255,0,0.2); }
    .c-dot.r { border-color: #ff4c29; background: rgba(255,76,41,0.2); }
    .c-dot.g { border-color: #9dff6e; background: rgba(157,255,110,0.2); }

    #console {
      background: var(--console-bg);
      color: var(--console-text);
      font-family: 'Share Tech Mono', monospace;
      font-size: 12.5px;
      line-height: 1.7;
      padding: 16px;
      flex: 1;
      overflow-y: auto;
      min-height: 340px;
      white-space: pre-wrap;
      word-break: break-all;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    #console::-webkit-scrollbar { width: 4px; }
    #console::-webkit-scrollbar-track { background: transparent; }
    #console::-webkit-scrollbar-thumb { background: var(--border); }

    .console-line-dim  { color: var(--console-dim); }
    .console-line-warn { color: #e8b400; }
    .console-line-err  { color: var(--accent-alt); }
    .console-line-ok   { color: var(--console-text); }
    .console-cursor {
      display: inline-block;
      width: 7px;
      height: 13px;
      background: var(--console-text);
      margin-left: 1px;
      vertical-align: middle;
      animation: blink 1.1s step-end infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    /* ─── FOOTER ─── */
    .ftr {
      border-top: 1px solid var(--border);
      padding: 14px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .ftr-left {
      font-size: 10px;
      color: var(--text-dim);
      letter-spacing: 0.06em;
    }

    .ftr-right {
      font-size: 10px;
      color: var(--text-dim);
      letter-spacing: 0.06em;
    }

    /* ─── GLITCH on title ─── */
    @keyframes glitch-1 {
      0%   { clip-path: inset(20% 0 60% 0); transform: translate(-3px, 0); }
      20%  { clip-path: inset(70% 0 10% 0); transform: translate(3px, 0); }
      40%  { clip-path: inset(40% 0 40% 0); transform: translate(-2px, 0); }
      60%  { clip-path: inset(10% 0 80% 0); transform: translate(2px, 0); }
      80%  { clip-path: inset(60% 0 20% 0); transform: translate(-1px, 0); }
      100% { clip-path: inset(20% 0 60% 0); transform: translate(0, 0); }
    }

    .hdr-title {
      position: relative;
    }

    .hdr-title::after {
      content: attr(data-text);
      position: absolute;
      left: 0;
      top: 0;
      color: var(--accent-alt);
      opacity: 0;
      animation: glitch-trigger 9s ease infinite;
    }

    @keyframes glitch-trigger {
      0%, 89%  { opacity: 0; }
      90%      { opacity: 0.7; animation-name: glitch-1, glitch-trigger; }
      90.5%    { opacity: 0; }
      100%     { opacity: 0; }
    }

    /* ─── RESPONSIVE ─── */
    @media (max-width: 660px) {
      .main {
        grid-template-columns: 1fr;
      }
      .hdr {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
      }
      .hdr-ua {
        text-align: left;
        max-width: none;
      }
      .hdr-title {
        font-size: 28px;
      }
      #console {
        min-height: 240px;
      }
    }
  </style>
</head>
<body>

<div class="shell">

  <!-- HEADER -->
  <header class="hdr">
    <div class="hdr-left">
      <span class="hdr-tag">CSSFontFace · UAF</span>
      <h1 class="hdr-title" data-text="EXPLOIT">EXPL<span>OI</span>T</h1>
    </div>
    <div class="hdr-ua">
      <strong id="UA">Detecting environment&hellip;</strong>
      <span id="UA-sub"></span>
    </div>
  </header>

  <!-- MAIN -->
  <main class="main">

    <!-- LEFT: control panel -->
    <div class="ctrl-panel">

      <div class="ctrl-section">
        <div class="ctrl-label">Kernel</div>
        <div class="kernel-opts" id="kernel-options">

          <label class="k-opt" for="netctrl-exploit">
            <input type="radio" name="kernel" id="netctrl-exploit" value="netctrl" checked>
            <span class="k-opt-name">NetCtrl</span>
            <span class="k-opt-sub">v1</span>
          </label>

          <label class="k-opt" for="lapse-exploit">
            <input type="radio" name="kernel" id="lapse-exploit" value="lapse">
            <span class="k-opt-name">Lapse</span>
            <span class="k-opt-sub">v2</span>
          </label>

        </div>
      </div>

      <div class="ctrl-section">
        <div class="ctrl-label">Status</div>
        <div class="status-strip">
          <div class="status-dot ready" id="status-dot"></div>
          <span class="status-text" id="status-text">IDLE</span>
        </div>
      </div>

      <div class="ctrl-section exec-wrap">
        <button id="jeilbrek">Execute</button>
      </div>

    </div>

    <!-- RIGHT: console output -->
    <div class="console-wrap">
      <div class="console-hdr">
        <span class="console-hdr-left">Output</span>
        <div class="console-hdr-right">
          <div class="c-dot r"></div>
          <div class="c-dot y"></div>
          <div class="c-dot g"></div>
        </div>
      </div>
      <pre id="console">Standby. Awaiting execution.
<span class="console-cursor"></span></pre>
    </div>

  </main>

  <!-- FOOTER -->
  <footer class="ftr">
    <span class="ftr-left">CSSFontFace UAF · webkit</span>
    <span class="ftr-right" id="ftr-ts"></span>
  </footer>

</div>

<script>
  /* ── UI helpers exposed globally so script.js & main.js can call them ── */

  // Live clock in footer
  (function() {
    const el = document.getElementById('ftr-ts');
    const pad = n => String(n).padStart(2, '0');
    function tick() {
      const d = new Date();
      el.textContent = d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate())
                     + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
    }
    tick(); setInterval(tick, 1000);
  })();

  // Console output
  var consoleEl = document.getElementById('console');

  window.appendLine = function(text, cls) {
    var cursor = consoleEl.querySelector('.console-cursor');
    if (cursor) cursor.remove();
    var line = document.createElement('span');
    if (cls) line.className = cls;
    line.textContent = text + '\n';
    consoleEl.appendChild(line);
    var cur = document.createElement('span');
    cur.className = 'console-cursor';
    consoleEl.appendChild(cur);
    consoleEl.scrollTop = consoleEl.scrollHeight;
  };

  window.clearConsole = function() {
    consoleEl.innerHTML = '';
    var cur = document.createElement('span');
    cur.className = 'console-cursor';
    consoleEl.appendChild(cur);
  };

  // Status dot + label
  window.setStatus = function(state, label) {
    document.getElementById('status-dot').className = 'status-dot ' + state;
    document.getElementById('status-text').textContent = label.toUpperCase();
  };
</script>

<script src="src/main.js"></script>
<script src="includes/script.js"></script>
</body>
</html>
