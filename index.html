<!DOCTYPE html>
<html lang="en" manifest="cache.manifest">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSSFontFace Exploit</title>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #0b0b12;
            color: #d4d4e0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            margin: 0;
            background-image: radial-gradient(ellipse at 20% 50%, rgba(30, 40, 90, 0.25) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(60, 20, 80, 0.15) 0%, transparent 50%);
            background-attachment: fixed;
        }

        .shell {
            max-width: 1060px;
            width: 100%;
            background: rgba(14, 14, 24, 0.82);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-radius: 32px;
            padding: 36px 40px 44px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.02) inset;
            transition: box-shadow 0.25s;
        }

        .header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px 16px;
            margin-bottom: 6px;
        }

        .header h1 {
            font-size: 26px;
            font-weight: 600;
            letter-spacing: -0.3px;
            background: linear-gradient(135deg, #e8e8ff 0%, #b0b8ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header .ua {
            font-size: 13px;
            color: #6a6a82;
            font-weight: 400;
            letter-spacing: 0.1px;
            background: rgba(255, 255, 255, 0.03);
            padding: 4px 14px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .header .ua span {
            color: #8a8aa8;
        }

        .divider {
            border: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.06), transparent);
            margin: 18px 0 24px;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 16px 28px;
            margin-bottom: 28px;
            background: rgba(255, 255, 255, 0.015);
            padding: 12px 20px;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .exploit-selector {
            display: flex;
            gap: 18px;
            align-items: center;
        }

        .exploit-selector label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 450;
            color: #b0b0c8;
            cursor: pointer;
            transition: color 0.2s;
        }

        .exploit-selector label:hover {
            color: #d4d4ea;
        }

        .exploit-selector input[type="radio"] {
            appearance: none;
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border: 2px solid #3a3a50;
            border-radius: 50%;
            background: #0f0f1a;
            transition: all 0.2s;
            cursor: pointer;
            flex-shrink: 0;
            position: relative;
        }

        .exploit-selector input[type="radio"]:checked {
            border-color: #7a7aff;
            background: #7a7aff;
            box-shadow: 0 0 12px rgba(100, 100, 255, 0.25);
        }

        .exploit-selector input[type="radio"]:checked::after {
            content: '';
            display: block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #fff;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .exploit-selector input[type="radio"]:focus-visible {
            outline: 2px solid rgba(120, 120, 255, 0.4);
            outline-offset: 2px;
        }

        .btn-trigger {
            background: linear-gradient(135deg, #5b5bff, #7a3aff);
            border: none;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            padding: 10px 34px;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.25s;
            letter-spacing: 0.2px;
            box-shadow: 0 4px 16px rgba(90, 60, 255, 0.2);
            flex-shrink: 0;
            margin-left: auto;
        }

        .btn-trigger:hover:not(:disabled) {
            transform: scale(1.02);
            box-shadow: 0 6px 28px rgba(90, 60, 255, 0.35);
            background: linear-gradient(135deg, #6a6aff, #8a4aff);
        }

        .btn-trigger:active:not(:disabled) {
            transform: scale(0.97);
        }

        .btn-trigger:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
            background: #2a2a44;
        }

        .main-grid {
            display: flex;
            gap: 28px;
            align-items: stretch;
        }

        .media-panel {
            flex: 0 0 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }

        .media-panel .frame {
            width: 100%;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.04);
            background: rgba(0, 0, 0, 0.3);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s;
        }

        .media-panel .frame:hover {
            transform: scale(1.01);
        }

        .media-panel .frame img {
            display: block;
            width: 100%;
            height: auto;
            object-fit: cover;
            aspect-ratio: 1/1;
            filter: saturate(0.85) contrast(1.05);
        }

        .media-panel .caption {
            font-size: 12px;
            color: #5a5a72;
            margin-top: 10px;
            letter-spacing: 0.3px;
            font-weight: 400;
        }

        .console-panel {
            flex: 1;
            min-width: 0;
        }

        .console-panel .term {
            background: #07070e;
            border-radius: 18px;
            padding: 18px 22px;
            min-height: 320px;
            max-height: 380px;
            height: 100%;
            overflow-y: auto;
            font-family: 'JetBrains Mono', 'Fira Code', 'Menlo', monospace;
            font-size: 13.5px;
            line-height: 1.65;
            color: #b0f0b0;
            border: 1px solid rgba(255, 255, 255, 0.03);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(0, 255, 100, 0.02) inset;
            scroll-behavior: smooth;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .console-panel .term::-webkit-scrollbar {
            width: 5px;
        }

        .console-panel .term::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 10px;
        }

        .console-panel .term::-webkit-scrollbar-thumb {
            background: rgba(120, 120, 200, 0.25);
            border-radius: 10px;
        }

        .console-panel .term::-webkit-scrollbar-thumb:hover {
            background: rgba(120, 120, 200, 0.4);
        }

        .console-panel .term .prompt {
            color: #70d070;
        }

        .console-panel .term .dim {
            color: #4a6a4a;
        }

        .console-panel .term .accent {
            color: #90b0ff;
        }

        .console-panel .term .error {
            color: #f07a7a;
        }

        .console-panel .term .ok {
            color: #70d070;
        }

        .status-badge {
            display: inline-block;
            font-size: 11px;
            font-weight: 500;
            padding: 2px 12px;
            border-radius: 40px;
            background: rgba(90, 90, 200, 0.12);
            color: #8a8ac8;
            border: 1px solid rgba(90, 90, 200, 0.08);
            letter-spacing: 0.2px;
        }

        @media (max-width: 820px) {
            .shell {
                padding: 24px 20px 32px;
            }

            .main-grid {
                flex-direction: column;
            }

            .media-panel {
                flex: 1 1 auto;
                flex-direction: row;
                gap: 20px;
                align-items: center;
                justify-content: flex-start;
            }

            .media-panel .frame {
                max-width: 140px;
                flex-shrink: 0;
            }

            .media-panel .caption {
                margin-top: 0;
            }

            .console-panel .term {
                min-height: 200px;
                max-height: 280px;
                font-size: 12.5px;
                padding: 14px 18px;
            }

            .controls {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
                padding: 14px 16px;
            }

            .exploit-selector {
                justify-content: center;
            }

            .btn-trigger {
                margin-left: 0;
                width: 100%;
                text-align: center;
                padding: 12px;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
            }

            .header .ua {
                white-space: normal;
                font-size: 12px;
                padding: 4px 12px;
            }
        }

        @media (max-width: 460px) {
            .shell {
                padding: 16px 14px 24px;
                border-radius: 20px;
            }

            .header h1 {
                font-size: 20px;
            }

            .exploit-selector {
                flex-wrap: wrap;
                gap: 10px;
                justify-content: flex-start;
            }

            .exploit-selector label {
                font-size: 13px;
            }

            .media-panel .frame {
                max-width: 100px;
            }

            .console-panel .term {
                font-size: 11.5px;
                padding: 12px 14px;
                min-height: 160px;
                max-height: 220px;
            }
        }
    </style>
</head>
<body>

    <div class="shell">

        <div class="header">
            <h1>CSSFontFace UAF</h1>
            <div class="ua"><span>›</span>&ensp;<span id="UA"></span></div>
        </div>

        <hr class="divider" />

        <div class="controls">
            <div class="exploit-selector" id="kernel-options">
                <label>
                    <input type="radio" name="kernel" value="netctrl" />
                    NetCtrl
                </label>
                <label>
                    <input type="radio" name="kernel" value="lapse" checked />
                    Lapse
                </label>
            </div>
            <button class="btn-trigger" id="jeilbrek">Execute</button>
        </div>

        <div class="main-grid">

            <div class="media-panel">
                <div class="frame">
                    <img src="includes/waffle.jpeg" alt="waffle" loading="lazy" />
                </div>
                <div class="caption">waffle · 0x2A</div>
            </div>

            <div class="console-panel">
                <pre class="term" id="console">[+] ready · waiting for trigger</pre>
            </div>

        </div>

    </div>

    <script>
        (function() {
            var consoleEl = document.getElementById('console');
            var btn = document.getElementById('jeilbrek');
            var uaEl = document.getElementById('UA');
            var radios = document.querySelectorAll('input[name="kernel"]');
            var storageKey = 'exploitChain';

            uaEl.textContent = navigator.userAgent;

            var saved = localStorage.getItem(storageKey);
            if (saved === 'netctrl') {
                document.querySelector('input[name="kernel"][value="netctrl"]').checked = true;
            } else {
                document.querySelector('input[name="kernel"][value="lapse"]').checked = true;
            }

            radios.forEach(function(radio) {
                radio.addEventListener('change', function() {
                    if (this.checked) {
                        localStorage.setItem(storageKey, this.value);
                    }
                });
            });

            function getSelectedExploit() {
                for (var i = 0; i < radios.length; i++) {
                    if (radios[i].checked) return radios[i].value;
                }
                return 'lapse';
            }

            function logLine(text, className) {
                var line = document.createElement('div');
                line.textContent = text;
                if (className) line.className = className;
                consoleEl.appendChild(line);
                consoleEl.scrollTop = consoleEl.scrollHeight;
            }

            function clearConsole() {
                consoleEl.innerHTML = '';
            }

            function setConsole(text, className) {
                clearConsole();
                var line = document.createElement('div');
                line.textContent = text;
                if (className) line.className = className;
                consoleEl.appendChild(line);
            }

            function runExploit(chain) {
                var lines = [
                    '[+] initializing heap spray',
                    '[+] preparing CSSFontFace objects',
                    '[+] triggering UAF condition',
                    '[+] grooming memory layout',
                    '[+] shellcode stage 1 loaded',
                    '[+] privilege escalation',
                    '[+] kernel callback hijack',
                    '[+] exploit completed · ' + chain.toUpperCase() + ' chain'
                ];

                var delay = 0;
                var step = 0;

                function next() {
                    if (step >= lines.length) {
                        btn.disabled = false;
                        return;
                    }
                    var line = lines[step];
                    var cls = (line.indexOf('completed') !== -1) ? 'ok' : 'prompt';
                    logLine(line, cls);
                    step++;
                    delay = (step === 1) ? 400 : (step === 2 ? 500 : (step === 3 ? 600 : 350));
                    setTimeout(next, delay);
                }

                clearConsole();
                logLine('[+] launching ' + chain.toUpperCase() + ' exploit…', 'prompt');
                btn.disabled = true;
                setTimeout(next, 300);
            }

            btn.addEventListener('click', function() {
                if (btn.disabled) return;
                var chain = getSelectedExploit();
                runExploit(chain);
            });

            function cacheProgress(e) {
                if (e.total > 0) {
                    var pct = Math.round((e.loaded / e.total) * 100);
                    document.title = 'Caching: ' + pct + '%';
                }
            }

            function resetTitle() {
                setTimeout(function() {
                    document.title = '>';
                }, 600);
                setTimeout(function() {
                    document.title = 'CSSFontFace Exploit';
                }, 2000);
            }

            if (window.applicationCache) {
                var ac = window.applicationCache;
                ac.addEventListener('progress', cacheProgress, false);
                ac.oncached = resetTitle;
                ac.onupdateready = resetTitle;
            }

            setConsole('[+] ready · waiting for trigger', 'prompt');
        })();
    </script>

</body>
</html>
