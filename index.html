<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSSFontFace</title>
    <style>
        :root {
            --bg: #0b0b0c;
            --surface: #141416;
            --border: #2a2a2e;
            --text: #c4c4c8;
            --text-dim: #6b6b72;
            --accent: #e5484d;
            --accent-glow: #ff6b6b;
            --green: #30a46c;
            --radius: 0px;
            --font: 'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-size: 13px;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            -webkit-font-smoothing: antialiased;
            height: 100%;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem;
            background:
                radial-gradient(ellipse at 30% 20%, rgba(229, 72, 77, 0.04) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 70%, rgba(48, 164, 108, 0.03) 0%, transparent 60%),
                var(--bg);
        }

        .panel {
            width: 100%;
            max-width: 620px;
            border: 1px solid var(--border);
            background: var(--surface);
            display: flex;
            flex-direction: column;
            gap: 0;
            box-shadow:
                0 0 0 4px rgba(0, 0, 0, 0.6),
                0 0 0 5px var(--border),
                0 20px 50px rgba(0, 0, 0, 0.7);
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--border);
            background: #0e0e10;
            user-select: none;
        }

        .panel-header .dot-row {
            display: flex;
            gap: 7px;
        }
        .panel-header .dot {
            width: 10px;
            height: 10px;
            border-radius: 0;
        }
        .dot.red {
            background: #e5484d;
        }
        .dot.amber {
            background: #d4883c;
        }
        .dot.green {
            background: #30a46c;
        }

        .panel-header .title-tag {
            font-size: 0.75rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--text-dim);
            font-weight: 600;
        }

        .panel-body {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .status-strip {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.6rem 0.9rem;
            border: 1px solid var(--border);
            background: #0a0a0c;
            font-size: 0.8rem;
            letter-spacing: 0.04em;
        }
        .status-strip .indicator {
            width: 7px;
            height: 7px;
            background: var(--text-dim);
            flex-shrink: 0;
            transition: background 0.3s;
        }
        .status-strip .indicator.live {
            background: var(--green);
            box-shadow: 0 0 8px rgba(48, 164, 108, 0.6);
        }
        #UA {
            color: var(--text);
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        fieldset {
            border: 1px solid var(--border);
            padding: 1rem 1.2rem;
            display: flex;
            flex-direction: column;
            gap: 0.7rem;
            background: #0c0c0e;
        }
        fieldset legend {
            padding: 0 0.5rem;
            font-size: 0.7rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--text-dim);
            font-weight: 700;
        }

        .radio-row {
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
        }
        .radio-option {
            display: flex;
            align-items: center;
            gap: 0.55rem;
            cursor: pointer;
            padding: 0.45rem 0.8rem;
            border: 1px solid transparent;
            transition: border-color 0.2s, background 0.2s;
            user-select: none;
        }
        .radio-option:hover {
            border-color: #3a3a40;
            background: #111113;
        }
        .radio-option input[type="radio"] {
            appearance: none;
            -webkit-appearance: none;
            width: 13px;
            height: 13px;
            border: 1.5px solid var(--border);
            background: #0e0e10;
            cursor: pointer;
            position: relative;
            flex-shrink: 0;
            transition: border-color 0.2s;
        }
        .radio-option input[type="radio"]:checked {
            border-color: var(--accent);
            background: #1a1012;
        }
        .radio-option input[type="radio"]:checked::after {
            content: '';
            position: absolute;
            inset: 3px;
            background: var(--accent);
        }
        .radio-option span {
            font-size: 0.85rem;
            letter-spacing: 0.03em;
            color: var(--text);
            font-weight: 500;
        }

        .btn-strip {
            display: flex;
            gap: 0;
        }
        #jeilbrek {
            flex: 1;
            padding: 0.9rem 1.5rem;
            font-family: var(--font);
            font-size: 0.85rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            font-weight: 700;
            cursor: pointer;
            border: 1.5px solid var(--accent);
            background: #1a0f10;
            color: var(--accent-glow);
            transition: background 0.2s, box-shadow 0.2s, color 0.2s;
            position: relative;
        }
        #jeilbrek:hover {
            background: #221315;
            box-shadow: inset 0 0 30px rgba(229, 72, 77, 0.15);
            color: #ff9090;
        }
        #jeilbrek:active {
            background: #0d0708;
            box-shadow: inset 0 0 15px rgba(229, 72, 77, 0.3);
            transition: none;
        }
        #jeilbrek:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            border-color: var(--border);
            background: #0e0e10;
            color: var(--text-dim);
            box-shadow: none;
        }

        .console-box {
            border: 1px solid var(--border);
            background: #060608;
            padding: 1rem 1.2rem;
            max-height: 180px;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #2a2a2e #0a0a0c;
        }
        .console-box pre {
            margin: 0;
            font-family: var(--font);
            font-size: 0.78rem;
            line-height: 1.6;
            color: #8a8a92;
            white-space: pre-wrap;
            word-break: break-all;
            letter-spacing: 0.02em;
        }
        .console-box pre .line-green {
            color: #30a46c;
        }
        .console-box pre .line-red {
            color: #e5484d;
        }

        .panel-footer {
            padding: 0.55rem 1rem;
            border-top: 1px solid var(--border);
            font-size: 0.68rem;
            color: #4a4a52;
            letter-spacing: 0.06em;
            display: flex;
            justify-content: space-between;
            background: #0c0c0e;
            user-select: none;
        }

        @media (max-width: 500px) {
            body {
                padding: 0.8rem;
            }
            .panel-body {
                padding: 1rem;
                gap: 1rem;
            }
            .radio-row {
                flex-direction: column;
                gap: 0.4rem;
            }
            #jeilbrek {
                padding: 0.8rem 1rem;
                font-size: 0.8rem;
            }
            .console-box {
                max-height: 140px;
                padding: 0.7rem 0.9rem;
            }
        }
    </style>
</head>
<body>

    <div class="panel">
        <div class="panel-header">
            <div class="dot-row">
                <span class="dot red"></span>
                <span class="dot amber"></span>
                <span class="dot green"></span>
            </div>
            <span class="title-tag">CSSFontFace</span>
            <span style="width:34px;"></span>
        </div>

        <div class="panel-body">
            <div class="status-strip">
                <span class="indicator" id="status-dot"></span>
                <span id="UA">Idle</span>
            </div>

            <form id="kernel-options">
                <fieldset>
                    <legend>Kernel Target</legend>
                    <div class="radio-row">
                        <label class="radio-option">
                            <input type="radio" name="kernel" id="netctrl-exploit" value="netctrl" checked>
                            <span>NetCtrl</span>
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="kernel" id="lapse-exploit" value="lapse">
                            <span>Lapse</span>
                        </label>
                    </div>
                </fieldset>
            </form>

            <div class="btn-strip">
                <button id="jeilbrek" type="button">Execute</button>
            </div>

            <div class="console-box">
                <pre id="console">Standing by.
</pre>
            </div>
        </div>

        <div class="panel-footer">
            <span>CSSFontFace UAF</span>
            <span id="ts-foot">---</span>
        </div>
    </div>

    <script>
        (function() {
            const uaEl = document.getElementById('UA');
            const statusDot = document.getElementById('status-dot');
            const consoleEl = document.getElementById('console');
            const btn = document.getElementById('jeilbrek');
            const tsFoot = document.getElementById('ts-foot');
            const kernelForm = document.getElementById('kernel-options');

            if (uaEl) {
                const raw = navigator.userAgent;
                const short = raw.length > 70 ? raw.slice(0, 67) + '...' : raw;
                uaEl.textContent = short;
                uaEl.title = raw;
            }

            function timestamp() {
                const now = new Date();
                return now.toTimeString().slice(0, 8);
            }
            tsFoot.textContent = timestamp();

            function log(msg, cls) {
                const line = document.createElement('span');
                line.textContent = '[' + timestamp() + '] ' + msg + '\n';
                if (cls) line.className = cls;
                consoleEl.appendChild(line);
                consoleEl.parentElement.scrollTop = consoleEl.parentElement.scrollHeight;
            }

            function setReady(state) {
                if (state) {
                    statusDot.classList.add('live');
                } else {
                    statusDot.classList.remove('live');
                }
            }

            if (btn) {
                btn.addEventListener('click', function() {
                    const selected = kernelForm.querySelector('input[name="kernel"]:checked');
                    const kernel = selected ? selected.value : 'netctrl';
                    log('Target: ' + kernel, 'line-green');
                    log('Triggering exploit chain...', 'line-green');
                    setReady(true);
                    btn.disabled = true;
                    btn.textContent = 'Running...';

                    setTimeout(function() {
                        log('Payload dispatched.', 'line-green');
                        setReady(false);
                        btn.disabled = false;
                        btn.textContent = 'Execute';
                        tsFoot.textContent = timestamp();
                    }, 1800);
                });
            }

            consoleEl.textContent = 'Standing by.\n';
            log('Interface initialized.', 'line-green');
        })();
    </script>

    <script src="src/main.js"></script>
    <script src="includes/script.js"></script>
</body>
</html>
